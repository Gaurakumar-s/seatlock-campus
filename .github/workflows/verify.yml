name: Verify SeatLock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatlock_test
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatlock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: H2 integration tests
        run: mvn -B -f backend/pom.xml test
      - name: Build and verify against PostgreSQL
        run: bash scripts/package.sh
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/seatlock_test
          TEST_DB_USER: seatlock
          TEST_DB_PASSWORD: test-password
      - uses: actions/upload-artifact@v4
        with:
          name: seatlock-application
          path: backend/target/seatlock-1.0.0.jar
